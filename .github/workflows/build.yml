name: Build and test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS app (Swift tests + build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # Tests run first so a packaging failure never hides a test failure.
      - name: Run Swift tests
        run: swift test

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      # CI has no stable signing identity; ad-hoc signing is enough to verify the bundle.
      - name: Build app bundle
        env:
          CODESIGN_IDENTITY: "-"
        run: ./scripts/build_app.sh

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/ClipboardSS.app build/ClipboardSS.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipboardSS-macOS
          path: build/ClipboardSS.zip
          if-no-files-found: error

  windows-core:
    name: Windows Core (C# tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Run Core tests
        run: dotnet test ClipboardSS.Windows/tests/ClipboardSS.Core.Tests

  companion:
    name: Flutter companion (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clipboard_companion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
