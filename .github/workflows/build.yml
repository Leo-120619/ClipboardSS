name: Build macOS app

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app bundle
        run: ./scripts/build_app.sh

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/ClipboardSS.app build/ClipboardSS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardSS-macOS
          path: build/ClipboardSS.zip
          if-no-files-found: error

      - name: Run tests
        run: swift test
